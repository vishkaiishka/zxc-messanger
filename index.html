<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZXC</title>
<link href="https://fonts.googleapis.com/css2?family=Russo+One&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#07060b;--sf:#14121a;--tx:#f6f1ea;--mu:#8e8698;--ac:#d6ff3f;--mg:#ff2f8e;--bd:#2c2636}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:15px/1.4 Manrope,system-ui,sans-serif}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:#221e2b;border-radius:12px;padding:10px 14px}
button.p{background:linear-gradient(135deg,var(--mg),#6d28ff);font-weight:700}
input{width:100%;background:#0c0a10;border:1px solid var(--bd);border-radius:12px;padding:12px;outline:0}
#auth{min-height:100%;display:flex;align-items:center;justify-content:center;padding:16px}
.card{width:min(460px,100%);background:#121018ee;border:1px solid #fff2;border-radius:20px;padding:22px;display:grid;gap:10px}
h1{font-family:"Russo One",sans-serif;margin:0;font-size:40px;color:var(--ac)}
.err{color:#ff6b6b;font-size:13px;white-space:pre-wrap}
.sql{font:12px/1.35 ui-monospace,monospace;background:#000;color:#d6ff3f;padding:10px;border-radius:10px;white-space:pre-wrap}
#app{display:grid;grid-template-columns:320px 1fr;height:100vh}
#side{background:var(--sf);border-right:1px solid var(--bd);display:flex;flex-direction:column;min-height:0}
#side header,#top,#bar{padding:10px;display:flex;gap:8px;align-items:center}
#list,#msgs{overflow:auto;flex:1}
.it{display:flex;gap:10px;padding:10px 12px;cursor:pointer}
.it.on,.it:hover{background:#fff1}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:#3a1848;font-weight:800;flex:none}
#main{display:flex;flex-direction:column;min-width:0;min-height:0}
.b{max-width:75%;padding:8px 12px;border-radius:16px;background:#1c1824;margin:4px 0}
.b.me{margin-left:auto;background:#2c1840}
.b.gift{text-align:center;border:1px solid #ffe27a55}
.e{font-size:64px;display:inline-block}
.pulse{animation:p 1.2s infinite}.bounce{animation:b 1s infinite}.spin{animation:s 2.4s linear infinite}.fly{animation:f 1.4s infinite}.glow{animation:g 1.2s infinite}.glitch{animation:gl .7s infinite}
@keyframes p{50%{transform:scale(1.15)}}
@keyframes b{50%{transform:translateY(-8px)}}
@keyframes s{to{transform:rotate(360deg)}}
@keyframes f{50%{transform:translate(8px,-12px)}}
@keyframes g{50%{filter:drop-shadow(0 0 10px #ffe27a)}}
@keyframes gl{50%{transform:translate(-2px,1px) skewX(-8deg)}}
.star{color:#ffe27a;font-weight:800}
.ov{position:fixed;inset:0;background:#000a;display:flex;align-items:flex-end;justify-content:center}
.sh{background:#14121a;width:min(520px,100%);max-height:86vh;overflow:auto;border-radius:16px 16px 0 0;padding:14px}
.gg{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.gi{background:#0c0a10;border-radius:12px;padding:8px;text-align:center;cursor:pointer}
#call{position:fixed;inset:0;background:#120816f2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;z-index:5}
.hide{display:none!important}
.mu{color:var(--mu);font-size:12px}
@media(max-width:800px){#app{grid-template-columns:1fr}#app.chat #side{display:none}#app:not(.chat) #main{display:none}}
</style>
</head>
<body>
<div id="auth">
  <form class="card" id="form">
    <h1>ZXC</h1>
    <div class="mu">ник + пароль. почта не нужна.</div>
    <div style="display:flex;gap:6px">
      <button type="button" id="tabin">вход</button>
      <button type="button" id="tabup">регистрация</button>
    </div>
    <input id="un" placeholder="username" required>
    <input id="pw" type="password" placeholder="пароль (от 6)" required>
    <div class="err" id="err"></div>
    <button class="p" id="go">войти</button>
    <details>
      <summary class="mu">если пишет permission denied или username null — вставь в SQL Editor</summary>
      <div class="sql" id="sqlbox"></div>
    </details>
  </form>
</div>
<div id="app" class="hide">
  <aside id="side">
    <header>
      <b>ZXC</b>
      <span class="star" id="bal">★ 0</span>
      <button id="mebtn" style="margin-left:auto">я</button>
      <button id="out">выйти</button>
    </header>
    <div style="padding:0 10px 8px"><input id="q" placeholder="ник человека"></div>
    <div id="list"></div>
  </aside>
  <section id="main">
    <div id="top" class="hide">
      <button id="back">←</button>
      <b id="title">чат</b>
      <button id="callbtn" style="margin-left:auto">звонок</button>
      <button id="giftbtn">подарки</button>
    </div>
    <div id="msgs"></div>
    <div id="bar" class="hide">
      <button id="stk">✦</button>
      <input id="tx" placeholder="сообщение">
      <button class="p" id="send">→</button>
    </div>
  </section>
</div>
<div id="modal"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.1/dist/umd/supabase.min.js"></script>
<script>
const URL_ = "https://qoqguzqatwqwqhpfccmn.supabase.co";
const KEY = "sb_publishable_rQi-joVpNO6d4zwpo0ZecQ_FZe14CCR";
const SQL = `grant usage on schema public to anon, authenticated;
grant select, insert, update, delete on all tables in schema public to anon, authenticated;
grant usage, select on all sequences in schema public to anon, authenticated;
alter table public.profiles alter column username drop not null;
alter table public.profiles alter column display_name drop not null;
alter table public.profiles alter column avatar_url drop not null;
drop policy if exists "Users join" on public.chat_members;
drop policy if exists "members write" on public.chat_members;
create policy "members write" on public.chat_members for insert with check (true);
drop policy if exists "msg update" on public.messages;
create policy "msg update" on public.messages for update using (true);`;
document.getElementById("sqlbox").textContent = SQL;
const sb = window.supabase.createClient(URL_, KEY);
const GIFTS = [
  ["heart","Сердце","❤️",15,"pulse"],["bear","Мишка","🧸",15,"bounce"],["box","Коробка","🎁",25,"spin"],
  ["rose","Роза","🌹",25,"pulse"],["cake","Торт","🎂",50,"bounce"],["rocket","Ракета","🚀",50,"fly"],
  ["star","Звезда","⭐",75,"glow"],["skull","Череп","💀",40,"glitch"],["void","Пустота","🖤",35,"pulse"],
  ["cursed","ZXC","☠️",80,"glitch"]
].map(([id,name,emoji,price,animation])=>({id,name,emoji,price,animation}));
const STICK = ["💀","☠️","🖤","⚡","🔥","😈","🤡","👀","🗿","💸","🧪","🕷️","⛓️","🦇"];
const $ = id => document.getElementById(id);
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&","<":"<",">":">",'"':""","'":"&#39;"}[c]));
let mode="in", me=null, cur=null, msgs=[], chats=[];
let pc=null, mic=null, callCh=null;

$("tabin").onclick=()=>{mode="in";$("go").textContent="войти"};
$("tabup").onclick=()=>{mode="up";$("go").textContent="создать"};
$("form").onsubmit=async e=>{
  e.preventDefault();
  const un=$("un").value.trim().toLowerCase().replace(/^@/,"");
  const pw=$("pw").value;
  $("err").textContent="...";
  $("go").disabled=true;
  try{
    if(!/^[a-z0-9_]{3,24}$/.test(un)) throw new Error("ник: латиница, цифры, _, от 3 до 24");
    const email=un+"@zxc.local";
    if(mode==="up"){
      const {data,error}=await sb.auth.signUp({email,password:pw,options:{data:{username:un,display_name:un}}});
      if(error) throw error;
      if(!data.session){
        const r=await sb.auth.signInWithPassword({email,password:pw});
        if(r.error) throw r.error;
      }
    }else{
      const {error}=await sb.auth.signInWithPassword({email,password:pw});
      if(error) throw error;
    }
    await start();
  }catch(err){
    const m=err.message||String(err);
    $("err").textContent=m+"\n\nОткрой SQL выше и выполни его в Supabase → SQL Editor, потом снова регистрацию.";
  }
  $("go").disabled=false;
};

async function start(){
  const {data}=await sb.auth.getUser();
  const u=data.user;
  if(!u) return;
  const un=(u.email||"").split("@")[0];
  let {data:p,error}=await sb.from("profiles").select("*").eq("id",u.id).maybeSingle();
  if(error) throw error;
  if(!p){
    const ins=await sb.from("profiles").insert({id:u.id,username:un,display_name:un,balance:100,status:"online"}).select().single();
    if(ins.error) throw ins.error;
    p=ins.data;
  }else if(!p.username){
    const up=await sb.from("profiles").update({username:un,display_name:p.display_name||un,balance:p.balance??100}).eq("id",u.id).select().single();
    if(up.error) throw up.error;
    p=up.data;
  }
  me=p;
  $("auth").classList.add("hide");
  $("app").classList.remove("hide");
  $("bal").textContent="★ "+(me.balance||0);
  sb.channel("rt-msg").on("postgres_changes",{event:"INSERT",schema:"public",table:"messages"}, ev=>{
    if(cur && ev.new.chat_id===cur && !msgs.some(m=>m.id===ev.new.id)){msgs.push(ev.new);drawMsgs()}
    loadChats();
  }).on("postgres_changes",{event:"UPDATE",schema:"public",table:"messages"}, ev=>{
    if(cur && ev.new.chat_id===cur){msgs=msgs.map(m=>m.id===ev.new.id?ev.new:m);drawMsgs()}
  }).subscribe();
  await loadChats();
}

async function loadChats(){
  const {data,error}=await sb.from("chat_members").select("chat_id").eq("user_id",me.id);
  if(error){$("list").innerHTML='<div class="mu" style="padding:12px">'+esc(error.message)+'</div>';return}
  const ids=(data||[]).map(x=>x.chat_id);
  chats=[];
  if(ids.length){
    const mem=await sb.from("chat_members").select("chat_id,user_id").in("chat_id",ids);
    const others=[...new Set((mem.data||[]).map(x=>x.user_id).filter(id=>id!==me.id))];
    let profs={};
    if(others.length){
      const pr=await sb.from("profiles").select("id,username,display_name").in("id",others);
      (pr.data||[]).forEach(p=>{profs[p.id]=p});
    }
    const by={};
    (mem.data||[]).forEach(x=>{(by[x.chat_id]||=[]).push(x.user_id)});
    chats=ids.map(id=>{
      const other=(by[id]||[]).find(x=>x!==me.id);
      const p=profs[other];
      return {id, title:p?.display_name||p?.username||"чат", other};
    });
  }
  drawList();
}
function drawList(){
  $("list").innerHTML=chats.map(c=>`<div class="it ${c.id===cur?"on":""}" data-c="${c.id}"><div class="av">${esc((c.title||"?")[0])}</div><div><b>${esc(c.title)}</b></div></div>`).join("")||'<div class="mu" style="padding:12px">чатов нет. введи ник сверху</div>';
}
$("q").onkeydown=async e=>{
  if(e.key!=="Enter") return;
  const un=$("q").value.trim().toLowerCase().replace(/^@/,"");
  if(!un) return;
  const {data,error}=await sb.from("profiles").select("id,username,display_name").eq("username",un).maybeSingle();
  if(error) return alert(error.message);
  if(!data) return alert("нет такого ника");
  if(data.id===me.id) return alert("это ты");
  await openDm(data.id);
  $("q").value="";
};
$("list").onclick=e=>{const n=e.target.closest("[data-c]"); if(n) openChat(n.dataset.c)};
async function openDm(other){
  const {data:mine}=await sb.from("chat_members").select("chat_id").eq("user_id",me.id);
  const ids=(mine||[]).map(x=>x.chat_id);
  if(ids.length){
    const hit=await sb.from("chat_members").select("chat_id").eq("user_id",other).in("chat_id",ids).limit(1);
    if(hit.data&&hit.data[0]) return openChat(hit.data[0].chat_id);
  }
  const chat=await sb.from("chats").insert({is_group:false}).select().single();
  if(chat.error) return alert(chat.error.message);
  const ins=await sb.from("chat_members").insert([{chat_id:chat.data.id,user_id:me.id},{chat_id:chat.data.id,user_id:other}]);
  if(ins.error) return alert(ins.error.message+"\n\nВыполни SQL со экрана входа (policy members write).");
  await loadChats();
  openChat(chat.data.id);
}
async function openChat(id){
  cur=id;
  $("app").classList.add("chat");
  $("top").classList.remove("hide");
  $("bar").classList.remove("hide");
  const c=chats.find(x=>x.id===id);
  $("title").textContent=c?.title||"чат";
  const r=await sb.from("messages").select("*").eq("chat_id",id).order("created_at",{ascending:true}).limit(200);
  if(r.error){$("msgs").textContent=r.error.message;return}
  msgs=r.data||[];
  drawMsgs();
  drawList();
}
function drawMsgs(){
  $("msgs").innerHTML=msgs.map(m=>{
    const meOwn=m.sender_id===me.id;
    let body=esc(m.content||"");
    if(m.type==="gift"){
      const g=GIFTS.find(x=>x.id===m.gift_id)||{emoji:"🎁",name:"",animation:"pulse"};
      body=`<div class="e ${g.animation}">${g.emoji}</div><div>${esc(g.name)}</div><div class="mu">${esc(m.content||"")}</div>`;
    }else if(m.type==="sticker"){
      body=`<div class="e bounce">${esc(m.content)}</div>`;
    }
    const rx=m.reactions&&typeof m.reactions==="object"?Object.entries(m.reactions).map(([k,v])=>`${k}${v}`).join(" "):"";
    return `<div class="b ${meOwn?"me":""} ${m.type==="gift"?"gift":""}" data-m="${m.id}">${body}<div class="mu">${rx}</div></div>`;
  }).join("")||'<div class="mu" style="padding:16px">пусто</div>';
  $("msgs").scrollTop=$("msgs").scrollHeight;
}
$("msgs").onclick=async e=>{
  const b=e.target.closest("[data-m]"); if(!b) return;
  const emoji=prompt("реакция","💀"); if(!emoji) return;
  const m=msgs.find(x=>x.id===b.dataset.m);
  const reactions={...(m.reactions||{})};
  reactions[emoji]=(reactions[emoji]||0)+1;
  const {error}=await sb.from("messages").update({reactions}).eq("id",m.id);
  if(error) return alert(error.message);
  m.reactions=reactions; drawMsgs();
};
async function send(type,content,gift_id){
  const r=await sb.from("messages").insert({chat_id:cur,sender_id:me.id,type,content,gift_id}).select().single();
  if(r.error) return alert(r.error.message);
  if(!msgs.some(m=>m.id===r.data.id)){msgs.push(r.data);drawMsgs()}
}
$("send").onclick=()=>{const t=$("tx").value.trim(); if(!t) return; $("tx").value=""; send("text",t,null)};
$("tx").onkeydown=e=>{if(e.key==="Enter") $("send").click()};
function sheet(html){$("modal").innerHTML=`<div class="ov" onclick="if(event.target===this)this.remove()"><div class="sh">${html}</div></div>`}
$("giftbtn").onclick=()=>{
  sheet(`<div class="star">★ ${me.balance||0}</div><div class="gg">${GIFTS.map(g=>`<div class="gi" data-g="${g.id}"><div class="e ${g.animation}">${g.emoji}</div>${g.name}<div class="mu">★${g.price}</div></div>`).join("")}</div>`);
  $("modal").querySelector(".gg").onclick=async ev=>{
    const el=ev.target.closest("[data-g]"); if(!el) return;
    const g=GIFTS.find(x=>x.id===el.dataset.g);
    if((me.balance||0)<g.price) return alert("мало звёзд");
    const note=prompt("подпись","")??"";
    const up=await sb.from("profiles").update({balance:me.balance-g.price}).eq("id",me.id);
    if(up.error) return alert(up.error.message);
    me.balance-=g.price; $("bal").textContent="★ "+me.balance;
    const c=chats.find(x=>x.id===cur);
    await sb.from("user_gifts").insert({gift_id:g.id,from_user:me.id,to_user:c?.other||me.id});
    $("modal").innerHTML="";
    send("gift",note,g.id);
  };
};
$("stk").onclick=()=>{
  sheet(`<div class="gg">${STICK.map(s=>`<div class="gi" data-s="${s}"><div class="e">${s}</div></div>`).join("")}</div>`);
  $("modal").querySelector(".gg").onclick=ev=>{
    const el=ev.target.closest("[data-s]"); if(!el) return;
    $("modal").innerHTML=""; send("sticker",el.dataset.s,null);
  };
};
$("mebtn").onclick=async()=>{
  const add=prompt("сколько звёзд начислить (демо)","100");
  if(!add) return;
  const n=Math.max(0,parseInt(add,10)||0);
  const up=await sb.from("profiles").update({balance:(me.balance||0)+n}).eq("id",me.id);
  if(up.error) return alert(up.error.message);
  me.balance+=n; $("bal").textContent="★ "+me.balance;
};
$("out").onclick=async()=>{await sb.auth.signOut(); location.reload()};
$("back").onclick=()=>$("app").classList.remove("chat");

function killCall(){
  try{pc&&pc.close()}catch(e){}
  pc=null; mic&&mic.getTracks().forEach(t=>t.stop()); mic=null;
  if(callCh){sb.removeChannel(callCh); callCh=null}
  $("call")&&$("call").remove();
}
async function micOn(){
  pc=new RTCPeerConnection({iceServers:[{urls:"stun:stun.l.google.com:19302"}]});
  mic=await navigator.mediaDevices.getUserMedia({audio:true});
  mic.getTracks().forEach(t=>pc.addTrack(t,mic));
  pc.ontrack=ev=>{const a=document.getElementById("ra"); if(a) a.srcObject=ev.streams[0]};
  pc.onicecandidate=ev=>{ if(ev.candidate&&callCh) callCh.send({type:"broadcast",event:"ice",payload:{from:me.id,c:ev.candidate}}) };
}
$("callbtn").onclick=async()=>{
  if(!cur) return;
  killCall();
  const box=document.createElement("div");
  box.id="call";
  box.innerHTML=`<b>звонок</b><div class="mu" id="cst">зовём</div><audio id="ra" autoplay></audio><button id="hang">сбросить</button>`;
  document.body.appendChild(box);
  $("hang").onclick=()=>{callCh&&callCh.send({type:"broadcast",event:"bye",payload:{from:me.id}}); killCall()};
  try{
    callCh=sb.channel("call-"+cur);
    callCh.on("broadcast",{event:"answer"}, async ({payload})=>{ if(payload.from!==me.id) await pc.setRemoteDescription(payload.sdp); $("cst").textContent="на связи"; })
      .on("broadcast",{event:"ice"}, async ({payload})=>{ if(payload.from!==me.id&&payload.c) try{await pc.addIceCandidate(payload.c)}catch(e){} })
      .on("broadcast",{event:"bye"}, ({payload})=>{ if(payload.from!==me.id) killCall(); })
      .on("broadcast",{event:"offer"}, async ({payload})=>{
        if(payload.from===me.id||pc) return;
        $("cst").textContent="входящий";
        if(!confirm("принять звонок?")) { callCh.send({type:"broadcast",event:"bye",payload:{from:me.id}}); return killCall(); }
        await micOn();
        await pc.setRemoteDescription(payload.sdp);
        const ans=await pc.createAnswer(); await pc.setLocalDescription(ans);
        callCh.send({type:"broadcast",event:"answer",payload:{from:me.id,sdp:pc.localDescription}});
        $("cst").textContent="на связи";
      }).subscribe();
    await micOn();
    const offer=await pc.createOffer(); await pc.setLocalDescription(offer);
    setTimeout(()=>callCh.send({type:"broadcast",event:"offer",payload:{from:me.id,sdp:pc.localDescription}}),500);
  }catch(err){ alert(err.message||"микрофон"); killCall(); }
};

sb.auth.getSession().then(({data})=>{ if(data.session) start().catch(e=>{$("err").textContent=e.message}) });
</script>
</body>
</html>
